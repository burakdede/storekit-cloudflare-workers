name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance: the published package is signed against this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run cf:typegen
      # The full gate: format, lint, typecheck, tests, build, pack, and a Worker dry-run build.
      - run: npm run release:check

      # A tag that disagrees with package.json would publish a version nobody can find from the
      # repository history.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # Proves the tarball an adopter installs actually resolves, typechecks under Node's own ESM
      # resolution, and bundles for workerd. This is what catches a broken export map.
      - name: Smoke-test the tarball in a scratch Worker
        run: node scripts/smoke-install.mjs

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
